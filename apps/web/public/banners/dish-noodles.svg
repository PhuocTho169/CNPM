  <g font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="400" y="552" font-size="26" font-weight="700" letter-spacing="9" fill="#fff7ed" opacity="0.95">MÓN NƯỚC</text>
    <text x="400" y="574" font-size="12" letter-spacing="5" fill="#fed7aa" opacity="0.85">DISTRICT 4 · NOODLE SOUP</text>
