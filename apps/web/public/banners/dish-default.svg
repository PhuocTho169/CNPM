    <rect x="170" y="176" width="38" height="46" rx="10" fill="#f3f4f6"/>
    <line x1="176" y1="180" x2="176" y2="216" stroke="#9ca3af" stroke-width="4"/>
    <line x1="186" y1="180" x2="186" y2="216" stroke="#9ca3af" stroke-width="4"/>
    <line x1="196" y1="180" x2="196" y2="216" stroke="#9ca3af" stroke-width="4"/>
  </g>
  <g transform="rotate(14 610 330)">
