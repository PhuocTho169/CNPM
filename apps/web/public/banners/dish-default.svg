  <ellipse cx="400" cy="332" rx="240" ry="114" fill="url(#df-plate)"/>
  <ellipse cx="400" cy="332" rx="188" ry="84" fill="#fdf3e3"/>
  <ellipse cx="400" cy="332" rx="140" ry="58" fill="#fffaf2"/>

