  <g font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="400" y="540" font-size="26" font-weight="700" letter-spacing="9" fill="#fffbeb" opacity="0.95">MÓN NGON QUẬN 4</text>
    <text x="400" y="562" font-size="12" letter-spacing="5" fill="#fde68a" opacity="0.9">DISTRICT 4 · SIGNATURE DISH</text>
  </g>
