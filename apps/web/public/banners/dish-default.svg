    <path d="M0 -74 L22 -22 L78 -22 L34 12 L50 66 L0 34 L-50 66 L-34 12 L-78 -22 L-22 -22 Z" fill="#f59e0b"/>
    <path d="M0 -52 L15 -16 L55 -16 L24 8 L35 46 L0 24 L-35 46 L-24 8 L-55 -16 L-15 -16 Z" fill="#fde68a"/>
  </g>

