      <stop offset="0" stop-color="#4e2600"/>
      <stop offset="0.55" stop-color="#b45309"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="df-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f0dfc8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#df-bg)"/>
  <circle cx="400" cy="290" r="240" fill="#fde68a" opacity="0.2"/>
  <g fill="#fef3c7" opacity="0.5">
    <circle cx="118" cy="130" r="4"/><circle cx="688" cy="158" r="5"/>
    <circle cx="146" cy="468" r="4"/><circle cx="666" cy="452" r="4.5"/>
    <circle cx="252" cy="92" r="3"/><circle cx="556" cy="98" r="3.5"/>
  </g>

  <!-- plate -->
