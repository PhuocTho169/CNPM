<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Cafe and drinks banner">
  <defs>
    <linearGradient id="dr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1f0b"/>
      <stop offset="0.5" stop-color="#8b5a2b"/>
      <stop offset="1" stop-color="#e7c496"/>
    </linearGradient>
    <linearGradient id="dr-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="dr-coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c3f16"/>
      <stop offset="1" stop-color="#3b1f0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#dr-bg)"/>
  <circle cx="400" cy="280" r="240" fill="#f5d7ab" opacity="0.2"/>

  <!-- phin filter -->
  <g>
    <ellipse cx="400" cy="512" rx="150" ry="20" fill="#241206" opacity="0.5"/>
    <!-- glass -->
    <path d="M318 262 L482 262 L470 500 C468 514 456 524 442 524 L358 524 C344 524 332 514 330 500 Z" fill="url(#dr-glass)" stroke="#f5e6d0" stroke-width="4"/>
    <!-- coffee in glass -->
    <path d="M330 402 L470 402 L470 500 C468 514 456 524 442 524 L358 524 C344 524 332 514 330 500 Z" fill="url(#dr-coffee)"/>
    <!-- condensed milk -->
    <path d="M334 468 L466 468 L470 500 C468 514 456 524 442 524 L358 524 C344 524 332 514 330 500 Z" fill="#fbe4c3" opacity="0.95"/>
    <!-- ice cubes -->
    <rect x="352" y="418" width="34" height="30" rx="7" fill="#ffffff" opacity="0.5" transform="rotate(-10 369 433)"/>
    <rect x="408" y="428" width="30" height="27" rx="7" fill="#ffffff" opacity="0.45" transform="rotate(12 423 441)"/>
    <rect x="382" y="446" width="26" height="24" rx="6" fill="#ffffff" opacity="0.4" transform="rotate(-6 395 458)"/>
    <!-- phin body -->
    <rect x="340" y="196" width="120" height="64" rx="10" fill="#9ca3af"/>
    <rect x="352" y="182" width="96" height="18" rx="8" fill="#d1d5db"/>
    <ellipse cx="400" cy="182" rx="48" ry="12" fill="#6b7280"/>
    <rect x="384" y="166" width="32" height="14" rx="6" fill="#e5e7eb"/>
    <!-- drip -->
    <line x1="400" y1="260" x2="400" y2="296" stroke="#7c3f16" stroke-width="7" stroke-linecap="round">
      <animate attributeName="y2" values="270;330;270" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- steam -->
  <g fill="none" stroke="#fff3e0" stroke-width="8" stroke-linecap="round" opacity="0.45">
    <path d="M356 150 C344 128 368 114 358 92"/>
    <path d="M430 142 C418 118 442 104 432 80"/>
  </g>

  <!-- coffee beans -->
  <g>
    <ellipse cx="216" cy="404" rx="26" ry="18" fill="#5b3013" transform="rotate(-20 216 404)"/>
    <path d="M198 392 C212 404 224 412 234 418" stroke="#3b1f0b" stroke-width="4" fill="none" transform="rotate(-20 216 404)"/>
    <ellipse cx="586" cy="374" rx="26" ry="18" fill="#5b3013" transform="rotate(16 586 374)"/>
    <path d="M568 386 C582 374 594 366 604 360" stroke="#3b1f0b" stroke-width="4" fill="none" transform="rotate(16 586 374)"/>
    <ellipse cx="252" cy="330" rx="18" ry="12" fill="#6b3a17" transform="rotate(28 252 330)"/>
    <ellipse cx="552" cy="302" rx="18" ry="12" fill="#6b3a17" transform="rotate(-24 552 302)"/>
  </g>

  <g font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="400" y="558" font-size="26" font-weight="700" letter-spacing="9" fill="#fff8ef" opacity="0.95">CÀ PHÊ · GIẢI KHÁT</text>
    <text x="400" y="580" font-size="12" letter-spacing="5" fill="#f5d7ab" opacity="0.9">DISTRICT 4 · CAFE &amp; DRINKS</text>
  </g>
</svg>
