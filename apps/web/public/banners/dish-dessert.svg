<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Dessert banner">
  <defs>
    <linearGradient id="ds-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#831843"/>
      <stop offset="0.55" stop-color="#db2777"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="ds-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fdf2f8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ds-bg)"/>
  <circle cx="400" cy="290" r="230" fill="#fce7f3" opacity="0.22"/>
  <g fill="#fbcfe8" opacity="0.55">
    <circle cx="120" cy="140" r="5"/><circle cx="690" cy="170" r="4"/>
    <circle cx="140" cy="460" r="4"/><circle cx="672" cy="450" r="5"/>
    <circle cx="250" cy="90" r="3"/><circle cx="560" cy="104" r="3.5"/>
  </g>

  <!-- che glass -->
  <g>
    <ellipse cx="400" cy="520" rx="150" ry="22" fill="#500724" opacity="0.5"/>
    <path d="M282 250 L518 250 L494 500 C492 516 476 528 458 528 L342 528 C324 528 308 516 306 500 Z" fill="url(#ds-glass)" opacity="0.55"/>
    <!-- layers -->
    <path d="M300 396 L500 396 L494 500 C492 516 476 528 458 528 L342 528 C324 528 308 516 306 500 Z" fill="#f59e0b" opacity="0.85"/>
    <path d="M305 348 L495 348 L500 396 L300 396 Z" fill="#22c55e" opacity="0.8"/>
    <path d="M312 300 L488 300 L495 348 L305 348 Z" fill="#fda4af" opacity="0.85"/>
    <!-- toppings -->
    <ellipse cx="400" cy="292" rx="96" ry="20" fill="#fef3c7"/>
    <circle cx="352" cy="286" r="12" fill="#ef4444" opacity="0.85"/>
    <circle cx="398" cy="280" r="11" fill="#7c3aed" opacity="0.75"/>
    <circle cx="444" cy="288" r="12" fill="#22c55e" opacity="0.85"/>
    <!-- coconut cream drizzle -->
    <path d="M330 316 C360 330 440 330 470 316" fill="none" stroke="#fff7ed" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- spoon -->
  <g transform="rotate(18 590 320)">
    <rect x="574" y="180" width="14" height="200" rx="7" fill="#e5e7eb"/>
    <ellipse cx="581" cy="170" rx="26" ry="34" fill="#f3f4f6"/>
    <ellipse cx="581" cy="168" rx="16" ry="22" fill="#d1d5db"/>
  </g>

  <!-- mint & beans -->
  <ellipse cx="300" cy="262" rx="20" ry="9" fill="#16a34a" transform="rotate(-24 300 262)"/>
  <ellipse cx="318" cy="244" rx="16" ry="7" fill="#22c55e" transform="rotate(20 318 244)"/>
  <circle cx="500" cy="452" r="8" fill="#7c3aed" opacity="0.7"/>
  <circle cx="470" cy="470" r="7" fill="#7c3aed" opacity="0.6"/>

  <g font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="400" y="552" font-size="26" font-weight="700" letter-spacing="9" fill="#fff1f2" opacity="0.95">NGỌT · TRÁNG MIỆNG</text>
    <text x="400" y="574" font-size="12" letter-spacing="5" fill="#fbcfe8" opacity="0.9">DISTRICT 4 · DESSERT</text>
  </g>
</svg>
