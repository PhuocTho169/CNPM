<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Street food banner">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.55" stop-color="#78350f"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="st-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#st-bg)"/>
  <circle cx="400" cy="300" r="240" fill="#fcd34d" opacity="0.16"/>

  <!-- lantern -->
  <g transform="translate(118 78)">
    <line x1="0" y1="-78" x2="0" y2="0" stroke="#3f2008" stroke-width="5"/>
    <rect x="-26" y="-6" width="52" height="12" rx="5" fill="#fbbf24"/>
    <rect x="-40" y="8" width="80" height="96" rx="36" fill="#ef4444"/>
    <rect x="-26" y="106" width="52" height="12" rx="5" fill="#fbbf24"/>
    <line x1="0" y1="118" x2="0" y2="146" stroke="#fbbf24" stroke-width="4"/>
  </g>
  <g transform="translate(676 120) scale(0.72)">
    <line x1="0" y1="-78" x2="0" y2="0" stroke="#3f2008" stroke-width="6"/>
    <rect x="-26" y="-6" width="52" height="12" rx="5" fill="#fbbf24"/>
    <rect x="-40" y="8" width="80" height="96" rx="36" fill="#ef4444"/>
    <rect x="-26" y="106" width="52" height="12" rx="5" fill="#fbbf24"/>
    <line x1="0" y1="118" x2="0" y2="146" stroke="#fbbf24" stroke-width="5"/>
  </g>

  <!-- grill -->
  <rect x="176" y="384" width="448" height="26" rx="13" fill="#374151"/>
  <g stroke="#111827" stroke-width="6">
    <line x1="220" y1="384" x2="220" y2="410"/>
    <line x1="290" y1="384" x2="290" y2="410"/>
    <line x1="360" y1="384" x2="360" y2="410"/>
    <line x1="430" y1="384" x2="430" y2="410"/>
    <line x1="500" y1="384" x2="500" y2="410"/>
    <line x1="570" y1="384" x2="570" y2="410"/>
  </g>
  <rect x="196" y="410" width="408" height="70" rx="16" fill="#1f2937"/>
  <rect x="240" y="440" width="320" height="12" rx="6" fill="#4b5563"/>

  <!-- flames -->
  <g opacity="0.9">
    <path d="M300 442 C288 414 316 402 310 376 C334 392 340 420 326 442 Z" fill="url(#st-flame)"/>
    <path d="M400 448 C384 412 420 398 412 364 C444 384 452 420 434 448 Z" fill="url(#st-flame)"/>
    <path d="M500 442 C488 414 516 402 510 376 C534 392 540 420 526 442 Z" fill="url(#st-flame)"/>
  </g>

  <!-- skewers -->
  <g>
    <g transform="translate(300 356) rotate(-8)">
      <rect x="-9" y="-128" width="9" height="150" rx="4.5" fill="#9a6132"/>
      <circle cy="-96" r="17" fill="#dc2626"/><circle cy="-62" r="17" fill="#f97316"/>
      <circle cy="-28" r="17" fill="#dc2626"/>
    </g>
    <g transform="translate(414 344) rotate(4)">
      <rect x="-9" y="-140" width="9" height="164" rx="4.5" fill="#9a6132"/>
      <circle cy="-106" r="18" fill="#f59e0b"/><circle cy="-70" r="18" fill="#dc2626"/>
      <circle cy="-34" r="18" fill="#f59e0b"/><circle cy="2" r="18" fill="#dc2626"/>
    </g>
    <g transform="translate(524 356) rotate(12)">
      <rect x="-9" y="-128" width="9" height="150" rx="4.5" fill="#9a6132"/>
      <circle cy="-96" r="17" fill="#f97316"/><circle cy="-62" r="17" fill="#dc2626"/>
      <circle cy="-28" r="17" fill="#f97316"/>
    </g>
  </g>

  <!-- smoke -->
  <g fill="none" stroke="#fde68a" stroke-width="7" stroke-linecap="round" opacity="0.35">
    <path d="M340 190 C326 166 356 152 344 128"/>
    <path d="M430 176 C416 148 446 134 434 106"/>
    <path d="M516 190 C502 166 532 152 520 128"/>
  </g>

  <g font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="400" y="536" font-size="26" font-weight="700" letter-spacing="9" fill="#fffbeb" opacity="0.95">ĂN VẶT · ĐÊM</text>
    <text x="400" y="558" font-size="12" letter-spacing="5" fill="#fde68a" opacity="0.85">DISTRICT 4 · STREET FOOD</text>
  </g>
</svg>
