<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="District 4 street food night scene">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241106"/>
      <stop offset="0.45" stop-color="#6d2a05"/>
      <stop offset="1" stop-color="#e65100"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#ffc077" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ff833a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff833a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="0.7" stop-color="#f3ddc4"/>
      <stop offset="1" stop-color="#d9b892"/>
    </linearGradient>
    <linearGradient id="broth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd79a"/>
      <stop offset="1" stop-color="#c2620a"/>
    </linearGradient>
    <linearGradient id="lantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6f5e"/>
      <stop offset="1" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1c07"/>
      <stop offset="1" stop-color="#1d0d03"/>
    </linearGradient>
  </defs>

  <rect width="960" height="720" fill="url(#sky)"/>
  <circle cx="480" cy="300" r="340" fill="url(#glow)"/>

  <!-- stars -->
  <g fill="#ffe3bd">
    <circle cx="90" cy="86" r="2.4" opacity="0.8"/>
    <circle cx="210" cy="52" r="1.7" opacity="0.55"/>
    <circle cx="330" cy="118" r="2" opacity="0.65"/>
    <circle cx="640" cy="70" r="2.2" opacity="0.7"/>
    <circle cx="760" cy="140" r="1.6" opacity="0.5"/>
    <circle cx="884" cy="72" r="2.4" opacity="0.75"/>
    <circle cx="520" cy="40" r="1.5" opacity="0.5"/>
    <circle cx="150" cy="188" r="1.6" opacity="0.45"/>
    <circle cx="822" cy="232" r="1.8" opacity="0.5"/>
  </g>

  <!-- skyline silhouette -->
  <g fill="#1c0d04" opacity="0.62">
    <path d="M0 556 L0 720 L960 720 L960 556 L900 556 L900 500 L852 500 L852 566 L800 566 L800 470 L764 470 L764 566 L716 566 L716 520 L664 520 L664 566 L612 566 L612 430 L596 402 L580 430 L580 566 L520 566 L520 505 L470 505 L470 566 L418 566 L418 452 L392 452 L392 566 L338 566 L338 522 L288 522 L288 566 L236 566 L236 486 L206 486 L206 566 L150 566 L150 528 L104 528 L104 566 L48 566 L48 512 L0 512 Z"/>
  </g>
  <!-- lit windows -->
  <g fill="#ffcf8a" opacity="0.75">
    <rect x="610" y="446" width="9" height="12"/>
    <rect x="628" y="446" width="9" height="12"/>
    <rect x="610" y="478" width="9" height="12"/>
    <rect x="796" y="486" width="9" height="12"/>
    <rect x="814" y="486" width="9" height="12"/>
    <rect x="796" y="516" width="9" height="12"/>
    <rect x="426" y="470" width="9" height="12"/>
    <rect x="446" y="470" width="9" height="12"/>
    <rect x="242" y="500" width="8" height="11"/>
    <rect x="260" y="500" width="8" height="11"/>
    <rect x="156" y="540" width="8" height="11"/>
  </g>

  <!-- hanging lanterns -->
  <g>
    <line x1="130" y1="0" x2="130" y2="128" stroke="#3a1c07" stroke-width="4"/>
    <ellipse cx="130" cy="196" rx="56" ry="66" fill="#ff7043" opacity="0.22"/>
    <rect x="114" y="124" width="32" height="10" rx="4" fill="#f2c063"/>
    <rect x="96" y="136" width="68" height="86" rx="32" fill="url(#lantern)"/>
    <rect x="114" y="224" width="32" height="10" rx="4" fill="#f2c063"/>
    <line x1="130" y1="234" x2="130" y2="272" stroke="#f2c063" stroke-width="4"/>
    <ellipse cx="130" cy="278" rx="7" ry="10" fill="#f2c063"/>

    <line x1="836" y1="0" x2="836" y2="92" stroke="#3a1c07" stroke-width="4"/>
    <ellipse cx="836" cy="152" rx="48" ry="58" fill="#ff7043" opacity="0.22"/>
    <rect x="822" y="88" width="28" height="9" rx="4" fill="#f2c063"/>
    <rect x="806" y="99" width="60" height="76" rx="28" fill="url(#lantern)"/>
    <rect x="822" y="177" width="28" height="9" rx="4" fill="#f2c063"/>
    <line x1="836" y1="186" x2="836" y2="220" stroke="#f2c063" stroke-width="4"/>
    <ellipse cx="836" cy="226" rx="6" ry="9" fill="#f2c063"/>
  </g>

  <!-- table -->
  <path d="M0 640 C240 612 720 612 960 640 L960 720 L0 720 Z" fill="url(#table)"/>

  <!-- steam -->
  <g fill="none" stroke="#ffe9cf" stroke-width="11" stroke-linecap="round" opacity="0.5">
    <path d="M416 400 C400 366 444 344 428 306">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M480 386 C464 344 508 320 492 278">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="5.6s" repeatCount="indefinite"/>
    </path>
    <path d="M544 400 C528 366 572 344 556 306">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- pho bowl -->
  <g>
    <ellipse cx="480" cy="646" rx="236" ry="30" fill="#000" opacity="0.35"/>
    <path d="M252 486 C252 582 340 648 480 648 C620 648 708 582 708 486 Z" fill="url(#bowl)"/>
    <ellipse cx="480" cy="486" rx="228" ry="46" fill="#fffaf3"/>
    <ellipse cx="480" cy="488" rx="202" ry="36" fill="url(#broth)"/>

    <!-- noodles -->
    <g fill="none" stroke="#fbe6c0" stroke-width="7" stroke-linecap="round" opacity="0.95">
      <path d="M330 492 C370 470 420 512 470 490"/>
      <path d="M392 508 C440 484 500 522 556 498"/>
      <path d="M446 474 C500 454 560 486 618 466"/>
      <path d="M352 512 C396 494 452 520 500 508"/>
    </g>

    <!-- toppings: beef, herbs, chili, egg -->
    <ellipse cx="420" cy="470" rx="30" ry="13" fill="#c05621" opacity="0.9"/>
    <ellipse cx="522" cy="504" rx="28" ry="12" fill="#9c3d10" opacity="0.9"/>
    <ellipse cx="576" cy="472" rx="24" ry="10" fill="#c05621" opacity="0.85"/>
    <ellipse cx="368" cy="498" rx="20" ry="8" fill="#2f855a" opacity="0.9"/>
    <ellipse cx="620" cy="494" rx="18" ry="8" fill="#276749" opacity="0.9"/>
    <ellipse cx="472" cy="516" rx="16" ry="7" fill="#2f855a" opacity="0.85"/>
    <circle cx="446" cy="502" r="9" fill="#e53e3e" opacity="0.9"/>
    <circle cx="548" cy="518" r="8" fill="#e53e3e" opacity="0.9"/>
    <circle cx="600" cy="510" r="16" fill="#fff8ee"/>
    <circle cx="600" cy="510" r="7" fill="#f6ad55"/>

    <!-- shrimp -->
    <g transform="translate(346 452) rotate(-18)">
      <path d="M0 0 C22 -16 48 -10 52 8 C55 22 44 32 30 30 C18 28 12 18 18 10" fill="none" stroke="#f56565" stroke-width="13" stroke-linecap="round"/>
      <path d="M46 26 L64 36 L50 40 Z" fill="#f56565"/>
    </g>

    <!-- chopsticks -->
    <g transform="rotate(-24 640 420)">
      <rect x="598" y="240" width="13" height="260" rx="6.5" fill="#8b5e34"/>
      <rect x="622" y="252" width="13" height="248" rx="6.5" fill="#a06b3c"/>
    </g>

    <!-- bowl rim highlight -->
    <path d="M300 486 C340 462 620 462 660 486" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.55" stroke-linecap="round"/>
  </g>

  <!-- floating herbs & chili -->
  <g opacity="0.9">
    <ellipse cx="196" cy="336" rx="18" ry="8" fill="#38a169" transform="rotate(-28 196 336)"/>
    <ellipse cx="222" cy="360" rx="14" ry="6" fill="#2f855a" transform="rotate(18 222 360)"/>
    <ellipse cx="756" cy="330" rx="18" ry="8" fill="#38a169" transform="rotate(24 756 330)"/>
    <path d="M782 356 C800 348 818 356 822 372 C810 378 792 374 782 356 Z" fill="#e53e3e"/>
    <circle cx="300" cy="280" r="5" fill="#f6ad55" opacity="0.85"/>
    <circle cx="672" cy="262" r="4" fill="#f6ad55" opacity="0.8"/>
    <circle cx="252" cy="420" r="3.5" fill="#ffe3bd" opacity="0.7"/>
    <circle cx="716" cy="430" r="3.5" fill="#ffe3bd" opacity="0.7"/>
  </g>

  <!-- wordmark -->
  <g font-family="system-ui, 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="480" y="690" font-size="30" font-weight="700" letter-spacing="10" fill="#ffd9b0" opacity="0.92">DISTRICT 4</text>
    <text x="480" y="706" font-size="13" letter-spacing="6" fill="#ffb27a" opacity="0.75">ẨM THỰC · AUDIO GUIDE</text>
  </g>
</svg>
