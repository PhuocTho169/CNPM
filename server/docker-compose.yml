services:
  postgres:
    image: postgres:16
    container_name: d4-postgres
    environment:
      POSTGRES_DB: district4_food
      POSTGRES_USER: district4_user
      POSTGRES_PASSWORD: district4_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U district4_user -d district4_food"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: d4-server
    env_file:
      - ./server/.env
    environment:
      # Inside Docker the backend MUST reach postgres by service name, not localhost
      DATABASE_URL: postgresql://district4_user:district4_password@postgres:5432/district4_food
      PORT: 5000
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node src/db/migrate.js && node src/db/seed.js && npx nodemon --legacy-watch src/index.js"
    volumes:
      # Dev: mount source so code changes are picked up without rebuilding.
      - ./server:/app/server
      - ./database:/app/database
      # Keep the image's node_modules (real files) instead of the host's pnpm
      # symlinks, which are broken inside Linux containers. The named volume is
      # seeded from the image on first creation.
      - server_node_modules:/app/server/node_modules
      # WORKDIR is /app/server and UPLOAD_DIR=uploads is relative, so the real
      # path is /app/server/uploads. Bind-mount the host dir instead of a named
      # volume: the TTS files referenced by media_files live here, and a named
      # volume shadows this dir, making every /uploads/audio URL 404 (no audio).
      - ./server/uploads:/app/server/uploads

  admin-web:
    # Dev: Vite dev server instead of the nginx production build so code edits
    # hot-reload without rebuilding the image.
    image: node:22-alpine3.20
    working_dir: /app
    container_name: d4-web
    environment:
      VITE_PROXY_TARGET: http://server:5000
      VITE_USE_POLLING: "true"
      COREPACK_ENABLE_STRICT: "0"
    command: >
      sh -c "corepack enable &&
             corepack install &&
             pnpm install --filter web &&
             pnpm --filter web dev --host 0.0.0.0"
    volumes:
      - .:/app
      - root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
    ports:
      - "8080:5173"
    depends_on:
      - server

volumes:
  postgres_data:
    name: district4_postgres_data
  server_node_modules:
  root_node_modules:
  web_node_modules:
